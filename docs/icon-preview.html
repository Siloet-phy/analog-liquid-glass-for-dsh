<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Analog Liquid Glass · 图标预览（多尺寸 / 深浅底）</title>
<style>
  body{margin:0;padding:24px 28px;background:#0f1116;color:#c9d1de;
       font-family:system-ui,"Segoe UI",sans-serif}
  h1{font-size:13px;font-weight:600;color:#8d97a6;margin:0 0 4px;font-family:ui-monospace,monospace}
  p.note{font-size:12px;color:#6d7480;margin:0 0 20px;font-family:ui-monospace,monospace}
  .row{display:flex;gap:26px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font-size:10.5px;font-family:ui-monospace,monospace;color:#6d7480}
  .light{background:#f6f7f9;border-radius:12px;padding:14px 16px;display:flex;gap:26px;align-items:flex-end}
  .light .cap{color:#868d9c}
  img{display:block}
  h2{font-size:12px;color:#8d97a6;margin:22px 0 10px;font-family:ui-monospace,monospace;font-weight:600}
</style>
</head>
<body>
<h1>Analog Liquid Glass · 图标（玻璃观液管 / 模拟水位计）</h1>
<p class="note">同一张 SVG 在 128 / 64 / 32 / 16 px 下的表现 —— 小尺寸是判断图标好坏的关键。</p>

<h2>深底（DSH 深色主题）</h2>
<div class="row">
  <div class="cell"><img src="icon-concept.svg" width="128" height="128" alt="128px"><span class="cap">128</span></div>
  <div class="cell"><img src="icon-concept.svg" width="64" height="64" alt="64px"><span class="cap">64</span></div>
  <div class="cell"><img src="icon-concept.svg" width="32" height="32" alt="32px"><span class="cap">32（市场卡片）</span></div>
  <div class="cell"><img src="icon-concept.svg" width="16" height="16" alt="16px"><span class="cap">16（列表）</span></div>
</div>

<h2>浅底（DSH 浅色主题）</h2>
<div class="light">
  <div class="cell"><img src="icon-concept.svg" width="64" height="64" alt="64px"><span class="cap">64</span></div>
  <div class="cell"><img src="icon-concept.svg" width="32" height="32" alt="32px"><span class="cap">32</span></div>
  <div class="cell"><img src="icon-concept.svg" width="16" height="16" alt="16px"><span class="cap">16</span></div>
</div>

<h2>对照：旧图标（玻璃输入框）</h2>
<div class="row">
  <div class="cell"><img src="../icon.svg" width="64" height="64" alt="旧图标"><span class="cap">icon.svg</span></div>
</div>
</body>
</html>
