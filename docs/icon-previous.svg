<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="液态玻璃输入框">
  <title>Liquid Glass Composer</title>
  <defs>
    <!-- 玻璃的冷调底：真正的液态玻璃近乎无色，只有极淡的环境色 -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <!-- 顶部镜面高光 -->
    <radialGradient id="spec" cx="50%" cy="-8%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 边缘的镶边光（天蓝，只出现在边上） -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#9ec9fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6f9fe0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a8d0f8"/>
      <stop offset="1" stop-color="#7caef0"/>
    </linearGradient>
  </defs>

  <!-- 外扩散泛光 -->
  <rect x="4" y="16" width="56" height="32" rx="14" fill="#8fbaf0" opacity="0.22"/>

  <!-- 玻璃本体 -->
  <rect x="7" y="19" width="50" height="26" rx="12" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.2"/>
  <rect x="7" y="19" width="50" height="26" rx="12" fill="url(#spec)"/>
  <!-- 内缘白线（上缘一道发丝光） -->
  <path d="M19 20.2 H45" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 三点泡泡：一个破灭、一个新生 -->
  <circle cx="20" cy="35.5" r="2.6" fill="url(#bub)" opacity="0.95"/>
  <circle cx="28" cy="30.5" r="2.1" fill="url(#bub)" opacity="0.7"/>
  <circle cx="35" cy="26.5" r="1.6" fill="url(#bub)" opacity="0.45"/>
</svg>
